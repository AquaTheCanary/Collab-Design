<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Organisation | Collab</title>
  <link rel="icon" type="image/png" href="../../../logo.png">
  <link rel="shortcut icon" type="image/png" href="../../../logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-black: #0a0a0c;
      --panel-bg: #141418;
      --border-color: #2a2a32;
      --brand-accent: #0f62fe;
      --text-gray: #a0a0ab;
      --text-light: #f4f4f8;
      --danger-red: #da1e28;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-black); color: var(--text-light); min-height: 100vh; display: flex; flex-direction: column; }
    
    header { display: flex; align-items: center; justify-content: space-between; padding: 0.85rem 2rem; border-bottom: 1px solid var(--border-color); }
    .brand { display: flex; align-items: center; gap: 0.85rem; text-decoration: none; color: #fff; font-weight: 700; font-size: 1.15rem; }
    .brand img { height: 34px; width: auto; }
    
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .auth-card { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; width: 100%; max-width: 440px; padding: 2.5rem; }
    
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--text-gray); margin-bottom: 0.4rem; }
    .form-group input { width: 100%; padding: 0.75rem; background: #0a0a0c; border: 1px solid var(--border-color); color: #fff; border-radius: 6px; }

    .btn { width: 100%; padding: 0.75rem; border-radius: 6px; font-weight: 600; cursor: pointer; border: none; background: var(--brand-accent); color: #fff; margin-top: 0.5rem; }
    .btn-secondary { background: transparent; border: 1px solid var(--border-color); color: #fff; }
    .error-msg { color: var(--danger-red); font-size: 0.82rem; margin-top: 0.4rem; display: none; }

    /* Step 2 Plan Selection Overlay */
    .step-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; z-index: 2000; }
    .plan-card { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 14px; width: 100%; max-width: 480px; padding: 2.5rem; text-align: center; }

    footer { border-top: 1px solid var(--border-color); padding: 2rem; text-align: center; color: var(--text-gray); font-size: 0.85rem; }
  </style>
</head>
<body>

  <header>
    <a href="../../../home/" class="brand">
      <img src="../../../logo.png" alt="Collab Design Logo">
      <span>Collab Design</span>
    </a>
  </header>

  <main>
    <div class="auth-card" id="step-1">
      <h2>Register Organisation</h2>
      <p style="color: var(--text-gray); font-size: 0.9rem; margin-bottom: 1.5rem;">Must use a valid company email domain.</p>

      <form id="org-register-form">
        <div class="form-group">
          <label for="org-title">Organisation Title</label>
          <input type="text" id="org-title" required placeholder="Acme Studios">
        </div>
        <div class="form-group">
          <label for="work-email">Work Email</label>
          <input type="email" id="work-email" required placeholder="admin@company.com">
          <div class="error-msg" id="email-error">Public email domains (gmail, outlook, yahoo, etc.) are restricted.</div>
        </div>
        <button type="submit" class="btn">Continue to Plan Selection →</button>
      </form>
    </div>
  </main>

  <!-- Step 2 Modal: Plan Prompt -->
  <div class="step-overlay" id="step-2">
    <div class="plan-card">
      <h2>Select Your Collab Tier</h2>
      <p style="color: var(--text-gray); margin-bottom: 2rem;">Choose whether to upgrade or stay on the free tier.</p>
      
      <div style="display: flex; flex-direction: column; gap: 1rem;">
        <button class="btn" onclick="completeRegistration('Organisation Pro ($29/mo)')">Upgrade to Organisation Pro ($29/mo)</button>
        <button class="btn btn-secondary" onclick="completeRegistration('Free Tier')">Cancel & Stick to Free Plan</button>
      </div>
    </div>
  </div>

  <footer>
    © Copyright (c) Collab Design 2026. A Convex Company. All rights reserved.
  </footer>

  <script>
    const restrictedDomains = ['gmail.com', 'outlook.com', 'yahoo.com', 'gmx.com', 'hotmail.com', 'icloud.com'];
    let pendingEmail = '';

    document.getElementById('org-register-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('work-email').value.toLowerCase().trim();
      const errorDiv = document.getElementById('email-error');

      const domain = email.split('@')[1];
      const validTLD = /\.[a-z]{2,}$/i.test(domain);

      if (!domain || restrictedDomains.includes(domain) || !validTLD) {
        errorDiv.style.display = 'block';
        return;
      }

      errorDiv.style.display = 'none';
      pendingEmail = email;
      document.getElementById('step-2').style.display = 'flex';
    });

    function completeRegistration(plan) {
      const session = {
        isLoggedIn: true,
        email: pendingEmail,
        type: 'organisation',
        plan: plan
      };
      localStorage.setItem('collab_user_session', JSON.stringify(session));
      window.location.href = '../../../dashboard/';
    }
  </script>
</body>
</html>
