<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vectra | Interactive Design Suite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #090d16;
      --bg-panel: #111827;
      --bg-card: #1f2937;
      --bg-input: #0f172a;
      --border: #1e293b;
      --border-light: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; user-select: none; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* --- Navbar --- */
    nav {
      height: 60px;
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 800;
      font-size: 1.25rem;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 8px;
      display: grid;
      place-items: center;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .file-status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      background: var(--bg-input);
      padding: 0.35rem 0.8rem;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
    }

    .nav-actions { display: flex; gap: 0.75rem; }

    .btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: #fff;
      padding: 0.5rem 1.1rem;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    }

    .btn-secondary {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background: var(--bg-card);
      box-shadow: none;
    }

    /* --- Toolbar --- */
    .toolbar {
      height: 52px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 1.5rem;
      gap: 0.5rem;
    }

    .tool-group {
      display: flex;
      background: var(--bg-input);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--border);
      gap: 2px;
    }

    .tool-btn {
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.15s ease;
    }

    .tool-btn.active, .tool-btn:hover {
      background: var(--primary);
      color: #fff;
    }

    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-left: auto;
      background: var(--bg-input);
      padding: 0.3rem 0.7rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      background: transparent;
    }

    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: 1px solid var(--border-light); border-radius: 50%; }

    /* --- Workspace Layout --- */
    .workspace {
      display: flex;
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .sidebar {
      width: 280px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    .layer-list {
      list-style: none;
      padding: 0.5rem;
      flex: 1;
      overflow-y: auto;
    }

    .layer-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      margin-bottom: 0.25rem;
      font-size: 0.88rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }

    .layer-item:hover, .layer-item.active {
      background: var(--bg-card);
      color: var(--text-main);
    }

    .layer-item.active {
      border: 1px solid var(--border);
    }

    /* --- Canvas Workspace --- */
    .canvas-container {
      flex: 1;
      background: #030712;
      display: grid;
      place-items: center;
      position: relative;
      background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 0);
      background-size: 24px 24px;
    }

    canvas {
      background: #0b0f19;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    /* --- Floating Inspector --- */
    .inspector {
      position: absolute;
      bottom: 2rem;
      right: 2rem;
      background: rgba(17, 24, 39, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      width: 220px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .inspector-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
      text-transform: uppercase;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 0.4rem;
    }

    .stat-value { font-weight: 600; color: var(--accent); }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav>
    <div class="brand">
      <div class="brand-icon">📐</div>
      Vectra Studio
    </div>
    
    <div class="file-status">
      <span class="status-dot"></span>
      <span>Untitled Vector — Saved</span>
    </div>

    <div class="nav-actions">
      <button class="btn btn-secondary" onclick="clearCanvas()">Clear</button>
      <button class="btn" onclick="exportCanvas()">Export PNG</button>
    </div>
  </nav>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="tool-group">
      <button class="tool-btn active" id="btn-select" onclick="setTool('select')">👆 Select</button>
      <button class="tool-btn" id="btn-rect" onclick="setTool('rect')">🟦 Rectangle</button>
      <button class="tool-btn" id="btn-circle" onclick="setTool('circle')">⚪ Circle</button>
    </div>

    <div class="color-picker-wrapper">
      <span>Color</span>
      <input type="color" id="fillColor" value="#38bdf8" onchange="updateColor(this.value)">
    </div>
  </div>

  <!-- Workspace -->
  <div class="workspace">
    <!-- Sidebar / Layers -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span>Layers</span>
        <span id="layer-count">0 Objects</span>
      </div>
      <ul class="layer-list" id="layerList"></ul>
    </aside>

    <!-- Canvas Area -->
    <main class="canvas-container">
      <canvas id="canvas" width="800" height="520"></canvas>

      <!-- Floating Inspector -->
      <div class="inspector">
        <div class="inspector-title">Inspector</div>
        <div class="stat-row"><span>Active Tool</span> <span class="stat-value" id="stat-tool">Select</span></div>
        <div class="stat-row"><span>Selected Object</span> <span class="stat-value" id="stat-selected">None</span></div>
        <div class="stat-row"><span>Canvas Resolution</span> <span class="stat-value">800×520</span></div>
      </div>
    </main>
  </div>

  <!-- Interactive JavaScript Engine -->
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let currentTool = 'select';
    let currentColor = '#38bdf8';
    let shapes = [];
    let selectedShape = null;
    let isDrawing = false;
    let isDragging = false;
    let startX, startY;

    function setTool(tool) {
      currentTool = tool;
      document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`btn-${tool}`).classList.add('active');
      document.getElementById('stat-tool').innerText = tool.charAt(0).toUpperCase() + tool.slice(1);
    }

    function updateColor(color) {
      currentColor = color;
      if (selectedShape) {
        selectedShape.color = color;
        render();
      }
    }

    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      startX = e.clientX - rect.left;
      startY = e.clientY - rect.top;

      if (currentTool === 'select') {
        selectedShape = [...shapes].reverse().find(s => isPointInShape(startX, startY, s));
        if (selectedShape) isDragging = true;
      } else {
        isDrawing = true;
      }
      updateUI();
      render();
    });

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      if (isDragging && selectedShape) {
        selectedShape.x += mouseX - startX;
        selectedShape.y += mouseY - startY;
        startX = mouseX;
        startY = mouseY;
        render();
      }
    });

    canvas.addEventListener('mouseup', (e) => {
      const rect = canvas.getBoundingClientRect();
      const endX = e.clientX - rect.left;
      const endY = e.clientY - rect.top;

      if (isDrawing) {
        if (currentTool === 'rect') {
          shapes.push({
            id: Date.now(),
            type: 'rect',
            x: Math.min(startX, endX),
            y: Math.min(startY, endY),
            w: Math.abs(endX - startX) || 40,
            h: Math.abs(endY - startY) || 40,
            color: currentColor
          });
        } else if (currentTool === 'circle') {
          const r = Math.sqrt(Math.pow(endX - startX, 2) + Math.pow(endY - startY, 2)) || 20;
          shapes.push({
            id: Date.now(),
            type: 'circle',
            x: startX,
            y: startY,
            r: r,
            color: currentColor
          });
        }
      }
      isDrawing = false;
      isDragging = false;
      updateUI();
      render();
    });

    function isPointInShape(x, y, shape) {
      if (shape.type === 'rect') return x >= shape.x && x <= shape.x + shape.w && y >= shape.y && y <= shape.y + shape.h;
      if (shape.type === 'circle') return Math.sqrt(Math.pow(x - shape.x, 2) + Math.pow(y - shape.y, 2)) <= shape.r;
      return false;
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      shapes.forEach(shape => {
        ctx.fillStyle = shape.color;
        if (shape.type === 'rect') {
          ctx.beginPath();
          ctx.roundRect(shape.x, shape.y, shape.w, shape.h, 6);
          ctx.fill();
        } else if (shape.type === 'circle') {
          ctx.beginPath();
          ctx.arc(shape.x, shape.y, shape.r, 0, Math.PI * 2);
          ctx.fill();
        }

        // Selected outline highlight
        if (shape === selectedShape) {
          ctx.strokeStyle = '#6366f1';
          ctx.lineWidth = 2;
          if (shape.type === 'rect') {
            ctx.strokeRect(shape.x - 3, shape.y - 3, shape.w + 6, shape.h + 6);
          } else if (shape.type === 'circle') {
            ctx.beginPath();
            ctx.arc(shape.x, shape.y, shape.r + 3, 0, Math.PI * 2);
            ctx.stroke();
          }
        }
      });
    }

    function updateUI() {
      const layerList = document.getElementById('layerList');
      layerList.innerHTML = '';

      shapes.forEach((shape, index) => {
        const li = document.createElement('li');
        li.className = `layer-item ${shape === selectedShape ? 'active' : ''}`;
        li.innerHTML = `<span>${shape.type === 'rect' ? '🟦 Rectangle' : '⚪ Circle'} ${index + 1}</span>`;
        li.onclick = () => { selectedShape = shape; render(); updateUI(); };
        layerList.appendChild(li);
      });

      document.getElementById('layer-count').innerText = `${shapes.length} Objects`;
      document.getElementById('stat-selected').innerText = selectedShape ? `${selectedShape.type}` : 'None';
    }

    function clearCanvas() {
      shapes = [];
      selectedShape = null;
      updateUI();
      render();
    }

    function exportCanvas() {
      const link = document.createElement('a');
      link.download = 'vectra-design.png';
      link.href = canvas.toDataURL();
      link.click();
    }

    render();
  </script>
</body>
</html>
