<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up | Vectra</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav>
    <a href="/" class="logo">📐 Vectra</a>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/pricing">Pricing</a></li>
      <li><a href="/login">Login</a></li>
      <li><a href="/editor" class="btn">Open Editor</a></li>
    </ul>
  </nav>

  <main class="container">
    <div class="form-card">
      <h2 style="margin-bottom: 0.5rem; font-size: 1.6rem;">Get Started Free</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">Create an individual creator account and start designing in seconds.</p>

      <form action="/signup" method="POST">
        <div class="form-group">
          <label for="full_name">Full Name</label>
          <input type="text" id="full_name" name="full_name" required placeholder="Alex Rivera">
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required placeholder="alex@domain.com">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="At least 8 characters">
        </div>

        <button type="submit" class="btn" style="width: 100%; padding: 0.75rem; margin-top: 0.5rem;">Create Account</button>
      </form>

      <p style="text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-top: 1.5rem;">
        Already have an account? <a href="/login" style="color: var(--accent); text-decoration: none;">Log in</a>
      </p>
    </div>
  </main>
</body>
</html>
