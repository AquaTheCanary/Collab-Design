<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Collab Workspace</title>
  <link rel="icon" type="image/png" href="../logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg-black: #0a0a0c; --panel-bg: #141418; --card-bg: #1a1a20; --border-color: #2a2a32; --brand-accent: #0f62fe; --text-gray: #a0a0ab; --text-light: #f4f4f8; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-black); color: var(--text-light); min-height: 100vh; display: flex; flex-direction: column; }
    
    header { display: flex; align-items: center; justify-content: space-between; padding: 0.85rem 2rem; border-bottom: 1px solid var(--border-color); background: var(--panel-bg); }
    .brand { display: flex; align-items: center; gap: 0.85rem; text-decoration: none; color: #fff; font-weight: 700; font-size: 1.15rem; }
    .brand img { height: 34px; width: auto; }
    
    .app-layout { display: flex; flex: 1; height: calc(100vh - 61px); }
    .sidebar { width: 240px; background: var(--panel-bg); border-right: 1px solid var(--border-color); padding: 1.5rem 1rem; }
    .content { flex: 1; padding: 2.5rem; overflow-y: auto; }

    .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.5rem; margin-top: 1.5rem; }
    .project-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
    .project-card:hover { transform: translateY(-3px); border-color: var(--brand-accent); }
    .project-thumb { height: 140px; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .project-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .project-info { padding: 1rem; }

    .btn { padding: 0.55rem 1.15rem; border-radius: 6px; font-weight: 600; font-size: 0.88rem; cursor: pointer; text-decoration: none; border: none; background: var(--brand-accent); color: #fff; }
    .btn-secondary { background: transparent; border: 1px solid var(--border-color); color: #fff; }

    .gate-screen { position: fixed; inset: 0; background: var(--bg-black); display: flex; align-items: center; justify-content: center; z-index: 3000; text-align: center; padding: 2rem; }
    .gate-card { background: var(--panel-bg); border: 1px solid var(--border-color); padding: 3rem 2rem; border-radius: 16px; max-width: 440px; width: 100%; }
    footer { border-top: 1px solid var(--border-color); padding: 1.5rem; text-align: center; color: var(--text-gray); font-size: 0.85rem; background: var(--panel-bg); }
  </style>
</head>
<body>

  <div class="gate-screen" id="auth-gate" style="display: none;">
    <div class="gate-card">
      <h2>Access Restricted</h2>
      <p style="color: var(--text-gray); margin: 1rem 0 2rem;">Please sign in to access your workspace dashboard.</p>
      <a href="../home/" class="btn" style="display: block;">Return to Home & Log In</a>
    </div>
  </div>

  <header id="main-header">
    <a href="../home/" class="brand"><img src="../logo.png" alt="Logo"><span>Collab Design</span></a>
    <div id="nav-actions" style="display: flex; gap: 0.75rem; align-items: center;"></div>
  </header>

  <div class="app-layout" id="main-layout">
    <aside class="sidebar">
      <h4 style="font-size: 0.75rem; text-transform: uppercase; color: var(--text-gray); margin-bottom: 1rem;">Workspaces</h4>
      <p style="font-size: 0.9rem; color: #fff; font-weight: 600;">📂 All Projects</p>
    </aside>

    <main class="content">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2>Workspace Projects</h2>
        <a href="../editor/" class="btn">+ New Canvas Studio</a>
      </div>

      <div class="projects-grid" id="projects-container"></div>
    </main>
  </div>

  <footer>© Copyright (c) Collab Design 2026. A Convex Company. All rights reserved.</footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const session = JSON.parse(localStorage.getItem('collab_user_session'));
      if (!session || !session.isLoggedIn) {
        document.getElementById('auth-gate').style.display = 'flex';
        document.getElementById('main-header').style.display = 'none';
        document.getElementById('main-layout').style.display = 'none';
        return;
      }

      document.getElementById('nav-actions').innerHTML = `
        <span style="font-size: 0.85rem; color: var(--text-gray);">${session.email}</span>
        <a href="../settings/" class="btn btn-secondary">Settings</a>
        <button class="btn btn-secondary" onclick="logout()">Log Out</button>
      `;

      loadProjects();
    });

    function loadProjects() {
      const container = document.getElementById('projects-container');
      let projects = JSON.parse(localStorage.getItem('collab_user_projects')) || [
        { title: 'Dark Mode UI Framework', thumb: '../logo.png', date: '2 hours ago' },
        { title: 'Mobile Prototype Wireframe', thumb: '../logo.png', date: 'Yesterday' }
      ];

      container.innerHTML = projects.map(p => `
        <div class="project-card" onclick="window.location.href='../editor/'">
          <div class="project-thumb"><img src="${p.thumb || '../logo.png'}" alt="Thumbnail"></div>
          <div class="project-info">
            <h4 style="font-size: 0.95rem; margin-bottom: 0.25rem;">${p.title}</h4>
            <p style="font-size: 0.78rem; color: var(--text-gray);">Updated ${p.date}</p>
          </div>
        </div>
      `).join('');
    }

    function logout() { localStorage.removeItem('collab_user_session'); window.location.href = '../home/'; }
  </script>
</body>
</html>
