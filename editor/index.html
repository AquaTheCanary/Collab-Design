<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor | Collab</title>
  
  <!-- Auth Guard: Restrict access to logged-in users only -->
  <script>
    (function checkAuth() {
      const session = localStorage.getItem('collab_session');
      if (!session) {
        alert('You must be logged in to access the editor.');
        window.location.href = '/auth/personal/login/index.html';
      }
    })();
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --chrome-bg: #2c2c2c;
      --panel-bg: #1e1e1e;
      --border: #383838;
      --brand-blue: #0f62fe;
      --text-muted: #b3b3b3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: #1e1e1e; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    .chrome-nav {
      height: 48px;
      background: var(--chrome-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1rem;
    }
    .tools { display: flex; gap: 0.25rem; }
    .tool-btn {
      width: 32px; height: 32px;
      background: transparent; border: none; color: #fff; border-radius: 4px; cursor: pointer; display: grid; place-items: center; font-size: 0.9rem;
    }
    .tool-btn:hover, .tool-btn.active { background: rgba(255,255,255,0.1); }

    .editor-container { flex: 1; display: flex; overflow: hidden; }
    .layers-sidebar { width: 220px; background: var(--panel-bg); border-right: 1px solid var(--border); padding: 0.75rem; display: flex; flex-direction: column; }
    .canvas-viewport { flex: 1; background: #121212; display: grid; place-items: center; position: relative; }
    canvas { background: #1e1e1e; box-shadow: 0 20px 50px rgba(0,0,0,0.8); border-radius: 4px; }
    .properties-sidebar { width: 240px; background: var(--panel-bg); border-left: 1px solid var(--border); padding: 1rem; }
    
    .btn-save { width: 100%; padding: 0.6rem; background: var(--brand-blue); color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: auto; }
  </style>
</head>
<body>

  <header class="chrome-nav">
    <a href="/home/index.html" style="display:flex; align-items:center; gap:0.5rem; text-decoration:none; color:#fff;">
      <svg width="24" height="24" viewBox="0 0 1000 1000" fill="none">
        <path d="M500 0C685 0 843 105 920 259C766 336 661 494 661 679C661 494 556 336 402 259C480 105 638 0 500 0Z" fill="#0f62fe"/>
        <path d="M500 1000C315 1000 157 895 80 741C234 664 339 506 339 321C339 506 444 664 598 741C520 895 362 1000 500 1000Z" fill="#0f62fe"/>
        <path d="M0 500C0 315 105 157 259 80C336 234 494 339 679 339C494 339 336 444 259 598C105 520 0 362 0 500Z" fill="#428be5"/>
        <path d="M1000 500C1000 685 895 843 741 920C664 766 506 661 321 661C506 661 664 556 741 402C895 480 1000 638 1000 500Z" fill="#428be5"/>
        <circle cx="500" cy="500" r="130" fill="#0f62fe"/>
      </svg>
      <span style="font-weight: 700; font-size: 0.95rem;">Untitled Board</span>
    </a>

    <div class="tools">
      <button class="tool-btn active" onclick="tool='rect'">🟦</button>
      <button class="tool-btn" onclick="tool='circle'">⚪</button>
      <input type="color" id="fillColor" value="#0f62fe" style="background:none; border:none; width:28px; height:28px; cursor:pointer;">
    </div>

    <div id="userProfileArea"></div>
  </header>

  <div class="editor-container">
    <aside class="layers-sidebar">
      <div style="font-size:0.75rem; font-weight:700; color:var(--text-muted); text-transform:uppercase; margin-bottom:0.75rem;">Layers</div>
      <ul id="layerList" style="list-style:none; flex:1;"></ul>
      <button class="btn-save" onclick="saveDesign()">Save Design</button>
    </aside>

    <main class="canvas-viewport">
      <canvas id="canvas" width="800" height="500"></canvas>
    </main>

    <aside class="properties-sidebar">
      <div style="font-size:0.75rem; font-weight:700; color:var(--text-muted); text-transform:uppercase; margin-bottom:0.75rem;">Design Specs</div>
      <p style="font-size:0.85rem; color:var(--text-muted);">Select shapes to edit.</p>
    </aside>
  </div>

  <script>
    const session = localStorage.getItem('collab_session');
    if (session) {
      document.getElementById('userProfileArea').innerHTML = `
        <a href="/accounts/users/index.html?user=${session}" style="color:#fff; text-decoration:none; font-size:0.85rem; font-weight:600;">@${session}</a>
      `;
    }

    let tool = 'rect', shapes = [];
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    canvas.onmousedown = (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const color = document.getElementById('fillColor').value;

      if (tool === 'rect') shapes.push({ type: 'rect', x, y, w: 90, h: 60, color });
      if (tool === 'circle') shapes.push({ type: 'circle', x, y, r: 40, color });
      draw();
    };

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      shapes.forEach(s => {
        ctx.fillStyle = s.color;
        if (s.type === 'rect') ctx.fillRect(s.x, s.y, s.w, s.h);
        if (s.type === 'circle') { ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill(); }
      });

      document.getElementById('layerList').innerHTML = shapes.map((s, i) => `
        <li style="padding:0.4rem; font-size:0.85rem; color:var(--text-muted); background:#181818; border-radius:4px; margin-bottom:0.3rem;">
          ${s.type === 'rect' ? '🟦 Rectangle' : '⚪ Circle'} ${i + 1}
        </li>
      `).join('');
    }

    function saveDesign() {
      const users = JSON.parse(localStorage.getItem('collab_users') || '{}');
      if (users[session]) {
        users[session].projects = users[session].projects || [];
        users[session].projects.push({ title: `Canvas Board #${users[session].projects.length + 1}`, date: 'Just now' });
        localStorage.setItem('collab_users', JSON.stringify(users));
        alert('Design saved!');
        window.location.href = `/accounts/users/index.html?user=${session}`;
      }
    }
  </script>
</body>
</html>
