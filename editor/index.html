<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor | Collab</title>

  <script src="/assets/js/app.js"></script>
  <script>App.requireAuth();</script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #121212;
      --panel-bg: #1e1e1e;
      --border: #2c2c2c;
      --brand: #0f62fe;
      --brand-hover: #0353e9;
      --text-muted: #a8a8a8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg-dark); color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    header {
      height: 52px; background: var(--panel-bg); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; padding: 0 1.25rem;
    }
    .brand-link { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; color: #fff; font-weight: 700; }
    
    .toolbar { display: flex; gap: 0.5rem; background: #141414; padding: 0.25rem 0.5rem; border-radius: 8px; border: 1px solid var(--border); }
    .tool-btn {
      padding: 0.4rem 0.8rem; background: transparent; border: none; color: var(--text-muted);
      border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: all 0.2s ease;
    }
    .tool-btn:hover { color: #fff; background: rgba(255,255,255,0.05); }
    .tool-btn.active { background: var(--brand); color: #fff; }

    .editor-layout { flex: 1; display: flex; overflow: hidden; }
    aside { width: 240px; background: var(--panel-bg); border-right: 1px solid var(--border); padding: 1rem; display: flex; flex-direction: column; }
    
    .viewport { flex: 1; background: #080808; display: grid; place-items: center; position: relative; }
    canvas { background: #181818; box-shadow: 0 20px 60px rgba(0,0,0,0.6); border-radius: 8px; }

    .btn-primary { padding: 0.75rem; background: var(--brand); color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .btn-primary:hover { background: var(--brand-hover); }
  </style>
</head>
<body>

  <header>
    <a href="#" id="homeLink" class="brand-link">
      <svg width="24" height="24" viewBox="0 0 1000 1000" fill="none"><path d="M500 0C685 0 843 105 920 259C766 336 661 494 661 679C661 494 556 336 402 259C480 105 638 0 500 0Z" fill="#0f62fe"/><circle cx="500" cy="500" r="130" fill="#0f62fe"/></svg>
      <span>Vector Studio</span>
    </a>

    <div class="toolbar">
      <button class="tool-btn active" data-tool="rect">Rect</button>
      <button class="tool-btn" data-tool="circle">Circle</button>
      <input type="color" id="colorPicker" value="#0f62fe" style="border:none; background:none; width:28px; height:28px; cursor:pointer;">
    </div>

    <div id="userBadge" style="font-size:0.85rem; font-weight:600;"></div>
  </header>

  <div class="editor-layout">
    <aside>
      <div style="font-size:0.75rem; font-weight:700; color:var(--text-muted); text-transform:uppercase; margin-bottom:1rem;">Layers</div>
      <ul id="layersContainer" style="list-style:none; flex:1; overflow-y:auto;"></ul>
      <button class="btn-primary" id="saveBtn">Save Project</button>
    </aside>

    <main class="viewport">
      <canvas id="stage" width="900" height="600"></canvas>
    </main>
  </div>

  <script type="module">
    document.getElementById('homeLink').href = App.url('/home/index.html');
    document.getElementById('userBadge').textContent = `@${App.getSession()}`;

    // Canvas State Manager
    class CanvasEngine {
      constructor(canvasId) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        this.shapes = [];
        this.activeTool = 'rect';
        this.activeColor = '#0f62fe';

        this.init();
      }

      init() {
        this.canvas.addEventListener('pointerdown', (e) => this.handlePointerDown(e));
        
        // Tool selectors
        document.querySelectorAll('.tool-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            this.activeTool = e.target.dataset.tool;
          });
        });

        document.getElementById('colorPicker').addEventListener('input', (e) => {
          this.activeColor = e.target.value;
        });

        this.render();
      }

      handlePointerDown(e) {
        const rect = this.canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const newShape = {
          id: crypto.randomUUID(),
          type: this.activeTool,
          x, y,
          size: this.activeTool === 'rect' ? { w: 100, h: 70 } : { r: 40 },
          color: this.activeColor
        };

        this.shapes.push(newShape);
        this.render();
      }

      render() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        
        this.shapes.forEach(shape => {
          this.ctx.fillStyle = shape.color;
          if (shape.type === 'rect') {
            this.ctx.fillRect(shape.x, shape.y, shape.size.w, shape.size.h);
          } else if (shape.type === 'circle') {
            this.ctx.beginPath();
            this.ctx.arc(shape.x, shape.y, shape.size.r, 0, Math.PI * 2);
            this.ctx.fill();
          }
        });

        this.updateLayerUI();
      }

      updateLayerUI() {
        const container = document.getElementById('layersContainer');
        container.innerHTML = this.shapes.map((s, i) => `
          <li style="padding:0.5rem; background:#141414; border-radius:6px; margin-bottom:0.4rem; font-size:0.8rem; display:flex; justify-between; align-items:center;">
            <span>${s.type === 'rect' ? '🟦 Rectangle' : '⚪ Circle'} ${i + 1}</span>
          </li>
        `).join('');
      }
    }

    const engine = new CanvasEngine('stage');

    document.getElementById('saveBtn').addEventListener('click', () => {
      alert('Design state saved directly to domain root session.');
      window.location.href = App.url('/dashboard/index.html');
    });
  </script>
</body>
</html>
