<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | Vectra</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav>
    <a href="/" class="logo">📐 Vectra</a>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/pricing">Pricing</a></li>
      <li><a href="/signup">Sign Up</a></li>
      <li><a href="/editor" class="btn">Open Editor</a></li>
    </ul>
  </nav>

  <main class="container">
    <div class="form-card">
      <h2 style="margin-bottom: 0.5rem; font-size: 1.6rem;">Welcome back</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">Enter your credentials to access your Vectra workspace.</p>

      <form action="/login" method="POST">
        <div class="form-group">
          <label for="email">Work Email</label>
          <input type="email" id="email" name="email" required placeholder="designer@company.com">
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
            <label for="password" style="margin-bottom: 0;">Password</label>
            <a href="#" style="color: var(--accent); font-size: 0.8rem; text-decoration: none;">Forgot password?</a>
          </div>
          <input type="password" id="password" name="password" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn" style="width: 100%; padding: 0.75rem; margin-top: 0.5rem;">Sign In</button>
      </form>

      <p style="text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-top: 1.5rem;">
        Don't have an account? <a href="/signup" style="color: var(--accent); text-decoration: none;">Sign up</a>
      </p>
    </div>
  </main>
</body>
</html>
