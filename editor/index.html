<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Editor | Collab</title>
  <link rel="icon" type="image/png" href="../logo.png">
  <link rel="shortcut icon" type="image/png" href="../logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-black: #08080a;
      --panel-bg: #121216;
      --border-color: #22222a;
      --brand-accent: #0f62fe;
      --text-gray: #888892;
      --text-light: #f4f4f8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-black); color: var(--text-light); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.6rem 1.5rem; border-bottom: 1px solid var(--border-color);
      background-color: var(--panel-bg);
    }
    .brand { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: #fff; font-weight: 700; font-size: 1rem; }
    .brand img { height: 28px; width: auto; }

    .editor-layout { display: flex; flex: 1; height: calc(100vh - 49px); }
    .left-bar { width: 240px; background: var(--panel-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
    .panel-title { padding: 0.85rem 1rem; font-size: 0.75rem; text-transform: uppercase; color: var(--text-gray); font-weight: 700; border-bottom: 1px solid var(--border-color); }
    .layer-list { list-style: none; flex: 1; overflow-y: auto; }
    .layer-item { padding: 0.65rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 0.85rem; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
    .layer-item.active { background: rgba(15, 98, 254, 0.2); border-left: 3px solid var(--brand-accent); }

    .viewport { flex: 1; background: #000; position: relative; display: flex; align-items: center; justify-content: center; }
    .toolbar { position: absolute; top: 1rem; left: 50%; transform: translateX(-50%); background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 0.4rem; display: flex; gap: 0.5rem; z-index: 100; }
    .tool-btn { padding: 0.5rem 0.85rem; background: transparent; border: none; color: var(--text-gray); border-radius: 4px; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
    .tool-btn.active, .tool-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

    #design-canvas { background: #1a1a20; border: 1px solid var(--border-color); cursor: crosshair; }

    .right-bar { width: 260px; background: var(--panel-bg); border-left: 1px solid var(--border-color); padding: 1rem; display: flex; flex-direction: column; gap: 1.25rem; }
    .prop-group { display: flex; flex-direction: column; gap: 0.4rem; }
    .prop-group label { font-size: 0.78rem; color: var(--text-gray); }
    .prop-row input { width: 100%; padding: 0.4rem; background: #08080a; border: 1px solid var(--border-color); color: #fff; border-radius: 4px; }

    .btn { padding: 0.5rem 1rem; border-radius: 6px; font-size: 0.85rem; cursor: pointer; border: none; font-weight: 600; text-decoration: none; text-align: center; }
    .btn-primary { background: var(--brand-accent); color: #fff; }
    .btn-secondary { background: transparent; color: #fff; border: 1px solid var(--border-color); }

    .gate-screen { position: fixed; inset: 0; background: var(--bg-black); display: flex; align-items: center; justify-content: center; z-index: 3000; text-align: center; padding: 2rem; }
    .gate-card { background: var(--panel-bg); border: 1px solid var(--border-color); padding: 3rem 2rem; border-radius: 16px; max-width: 440px; width: 100%; }
  </style>
</head>
<body>

  <div class="gate-screen" id="auth-gate" style="display: none;">
    <div class="gate-card">
      <h2 style="font-size: 1.75rem; margin-bottom: 0.5rem;">Access Restricted</h2>
      <p style="color: var(--text-gray); margin-bottom: 2rem;">Please sign in to launch the Collab Canvas Studio.</p>
      <a href="../home/" class="btn btn-primary" style="width: 100%;">Return to Home & Log In</a>
    </div>
  </div>

  <header id="main-header">
    <a href="../home/" class="brand">
      <img src="../logo.png" alt="Collab Design Logo">
      <span>Collab Studio</span>
    </a>
    <div style="font-size: 0.88rem; color: var(--text-gray);">File: Interactive_Canvas_V1</div>
    <a href="../dashboard/" class="btn btn-secondary">Exit Studio</a>
  </header>

  <div class="editor-layout" id="main-layout">
    <aside class="left-bar">
      <div class="panel-title">Layers</div>
      <ul class="layer-list" id="layer-tree"></ul>
    </aside>

    <main class="viewport">
      <div class="toolbar">
        <button class="tool-btn active" id="btn-select" onclick="setTool('select')">🖐️ Select / Drag</button>
        <button class="tool-btn" id="btn-rect" onclick="setTool('rect')">🟦 Rectangle</button>
        <button class="tool-btn" id="btn-circle" onclick="setTool('circle')">⭕ Circle</button>
        <button class="tool-btn" onclick="deleteSelected()">🗑️ Delete</button>
      </div>

      <canvas id="design-canvas" width="800" height="500"></canvas>
    </main>

    <aside class="right-bar">
      <div class="panel-title">Inspector</div>
      <div class="prop-group">
        <label>Object Fill Color</label>
        <input type="color" id="fill-picker" value="#0f62fe" onchange="updateFill()">
      </div>
      <button class="btn btn-primary" onclick="exportPNG()">Export Canvas Image</button>
    </aside>
  </div>

  <script>
    let canvas, ctx, isDragging = false, dragOffset = { x: 0, y: 0 };
    let activeTool = 'select', selectedIndex = null;
    let shapes = [
      { type: 'rect', x: 100, y: 100, w: 200, h: 120, color: '#0f62fe' },
      { type: 'circle', x: 450, y: 200, r: 60, color: '#428be5' }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      const session = JSON.parse(localStorage.getItem('collab_user_session'));
      if (!session || !session.isLoggedIn) {
        document.getElementById('auth-gate').style.display = 'flex';
        document.getElementById('main-header').style.display = 'none';
        document.getElementById('main-layout').style.display = 'none';
        return;
      }

      canvas = document.getElementById('design-canvas');
      ctx = canvas.getContext('2d');

      canvas.addEventListener('mousedown', onMouseDown);
      canvas.addEventListener('mousemove', onMouseMove);
      canvas.addEventListener('mouseup', () => isDragging = false);

      render();
    });

    function setTool(tool) {
      activeTool = tool;
      document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`btn-${tool}`)?.classList.add('active');
    }

    function onMouseDown(e) {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      if (activeTool === 'rect') {
        shapes.push({ type: 'rect', x: x - 50, y: y - 30, w: 100, h: 60, color: document.getElementById('fill-picker').value });
        selectedIndex = shapes.length - 1;
      } else if (activeTool === 'circle') {
        shapes.push({ type: 'circle', x: x, y: y, r: 40, color: document.getElementById('fill-picker').value });
        selectedIndex = shapes.length - 1;
      } else if (activeTool === 'select') {
        selectedIndex = null;
        for (let i = shapes.length - 1; i >= 0; i--) {
          const s = shapes[i];
          if (s.type === 'rect' && x >= s.x && x <= s.x + s.w && y >= s.y && y <= s.y + s.h) {
            selectedIndex = i;
            isDragging = true;
            dragOffset = { x: x - s.x, y: y - s.y };
            break;
          } else if (s.type === 'circle' && Math.hypot(x - s.x, y - s.y) <= s.r) {
            selectedIndex = i;
            isDragging = true;
            dragOffset = { x: x - s.x, y: y - s.y };
            break;
          }
        }
      }
      render();
    }

    function onMouseMove(e) {
      if (!isDragging || selectedIndex === null) return;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      shapes[selectedIndex].x = x - dragOffset.x;
      shapes[selectedIndex].y = y - dragOffset.y;
      render();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      shapes.forEach((s, idx) => {
        ctx.fillStyle = s.color;
        if (s.type === 'rect') ctx.fillRect(s.x, s.y, s.w, s.h);
        else if (s.type === 'circle') {
          ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
        }

        if (idx === selectedIndex) {
          ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
          if (s.type === 'rect') ctx.strokeRect(s.x - 2, s.y - 2, s.w + 4, s.h + 4);
          else if (s.type === 'circle') { ctx.beginPath(); ctx.arc(s.x, s.y, s.r + 3, 0, Math.PI * 2); ctx.stroke(); }
        }
      });

      document.getElementById('layer-tree').innerHTML = shapes.map((s, idx) => `
        <li class="layer-item ${idx === selectedIndex ? 'active' : ''}" onclick="selectedIndex=${idx};render();">
          <span>${s.type === 'rect' ? 'Rectangle' : 'Circle'} ${idx + 1}</span>
        </li>
      `).join('');
    }

    function updateFill() {
      if (selectedIndex !== null) { shapes[selectedIndex].color = document.getElementById('fill-picker').value; render(); }
    }

    function deleteSelected() {
      if (selectedIndex !== null) { shapes.splice(selectedIndex, 1); selectedIndex = null; render(); }
    }

    function exportPNG() {
      const a = document.createElement('a');
      a.download = 'collab-canvas-export.png'; a.href = canvas.toDataURL(); a.click();
    }
  </script>
</body>
</html>
