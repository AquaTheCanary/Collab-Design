<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Collab</title>
  <link rel="icon" type="image/png" href="../logo.png">
  
  <script>
    (function checkAuth() {
      if (!localStorage.getItem('collab_session')) {
        window.location.href = '/auth/personal/login/index.html';
      }
    })();
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0c0d0e; --panel: #16171a; --border: #26272b; --brand-blue: #0f62fe; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg); color: #fff; min-height: 100vh; display: flex; }

    sidebar { width: 220px; background: var(--panel); border-right: 1px solid var(--border); padding: 1.5rem 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
    sidebar a { padding: 0.6rem 0.8rem; color: #a0a0a0; text-decoration: none; font-size: 0.9rem; font-weight: 500; border-radius: 6px; }
    sidebar a.active, sidebar a:hover { background: rgba(255,255,255,0.05); color: #fff; }

    main { flex: 1; padding: 2.5rem; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    
    .btn-create { padding: 0.75rem 1.25rem; background: var(--brand-blue); color: #fff; border: none; border-radius: 6px; font-weight: 600; text-decoration: none; cursor: pointer; }
  </style>
</head>
<body>
  <sidebar>
    <div style="font-weight: 800; font-size: 1.2rem; margin-bottom: 1.5rem; color: #fff;">Collab</div>
    <a href="/dashboard/index.html" class="active">❖ Recents</a>
    <a href="/dashboard/settings/index.html">⚙ Settings</a>
    <a href="#" onclick="localStorage.removeItem('collab_session'); location.href='/home/index.html';">🚪 Sign Out</a>
  </sidebar>

  <main>
    <div class="top-bar">
      <div>
        <h1 style="font-size: 1.8rem;">Recent Design Drafts</h1>
        <p style="color: #777; font-size: 0.9rem;">Welcome back to your workspace</p>
      </div>
      <a href="/editor/index.html" class="btn-create">+ New File</a>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.25rem;">
      <a href="/editor/index.html" style="text-decoration: none; color: inherit;">
        <div style="height: 140px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; display: grid; place-items: center;">
          <span style="font-size: 2rem;">🎨</span>
        </div>
        <p style="margin-top: 0.5rem; font-weight: 600; font-size: 0.9rem;">Untitled Canvas Board</p>
      </a>
    </div>
  </main>
</body>
</html>
