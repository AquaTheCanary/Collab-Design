<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Collab</title>
  <script src="/assets/js/app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { background: #000; color: #fff; min-height: 100vh; display: grid; place-items: center; font-family: 'Inter', sans-serif; }
    .card { width: 100%; max-width: 380px; padding: 2rem; background: #111; border: 1px solid #222; border-radius: 12px; }
    input { width: 100%; padding: 0.75rem; margin: 0.5rem 0 1rem; background: #000; border: 1px solid #333; color: #fff; border-radius: 6px; }
    button { width: 100%; padding: 0.75rem; background: #0f62fe; color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h2 style="margin-bottom: 1rem;">Welcome back</h2>
    <form id="loginForm">
      <label style="font-size: 0.85rem; color: #888;">Username</label>
      <input type="text" id="username" required placeholder="Enter handle">
      <button type="submit">Log In</button>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      if (user) {
        App.setSession(user);
        // Automatically redirects to the editor relative to your new custom domain root
        window.location.href = App.url('/editor/index.html');
      }
    });
  </script>
</body>
</html>
