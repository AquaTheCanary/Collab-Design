<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register Org | Vectra</title>
  <link rel="stylesheet" href="/collab/static/css/style.css">
</head>
<body>
  <nav>
    <a href="/collab/home/" class="logo"><span class="logo-badge">📐</span> Vectra</a>
  </nav>

  <main class="container">
    <div class="card">
      <h2>Register Organization</h2>
      <form action="/collab/dashboard/" method="GET" style="margin-top: 1.5rem;">
        <div class="form-group"><label>Organization Name</label><input type="text" required placeholder="Acme Studio"></div>
        <div class="form-group"><label>Admin Email</label><input type="email" required placeholder="admin@company.com"></div>
        <div class="form-group"><label>Password</label><input type="password" required placeholder="••••••••"></div>
        <button type="submit" class="btn" style="width: 100%;">Create Workspace</button>
      </form>
    </div>
  </main>
</body>
</html>
