<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Editor | Vectra</title>
  <link rel="stylesheet" href="/collab/static/css/style.css">
</head>
<body style="overflow: hidden;">
  <div class="editor-toolbar">
    <a href="/collab/home/home.html" class="logo">📐 Vectra</a>
    <button class="tool-btn active" data-tool="select">👆 Select</button>
    <button class="tool-btn" data-tool="rect">🟦 Rectangle</button>
    <button class="tool-btn" data-tool="circle">⚪ Circle</button>
    <input type="color" id="fillColor" value="#0d99ff" style="margin-left: auto;">
  </div>

  <div class="editor-layout">
    <aside class="editor-sidebar">
      <h4 style="color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase;">Layers</h4>
      <div style="margin-top: 1rem;">Canvas Active</div>
    </aside>
    <main class="canvas-area">
      <canvas id="designCanvas" width="800" height="550"></canvas>
    </main>
  </div>

  <script src="/collab/static/js/editor.js"></script>
</body>
</html>
