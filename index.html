<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Setup</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-8 max-w-md w-full">
        
        <!-- Step 1: Email First -->
        <div id="step-email" class="space-y-5">
            <h2 class="text-3xl font-bold text-white">Welcome!</h2>
            <p class="text-slate-400">Let's get you going. Enter your email address to begin setup.</p>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Email Address</label>
                <input type="email" id="email-input" placeholder="you@example.com" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white placeholder-slate-500">
            </div>
            <p id="email-error" class="text-red-400 text-sm hidden"></p>
            <button onclick="sendVerificationCode()" id="send-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition duration-200">Send Verification Code</button>
        </div>

        <!-- Step 2: Verification Code -->
        <div id="step-verify" class="space-y-5 hidden">
            <h2 class="text-3xl font-bold text-white">Check Your Email</h2>
            <p class="text-slate-400">We sent a 6-digit code to <span id="sent-email-display" class="text-indigo-400 font-semibold"></span>.</p>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">6-Digit Code</label>
                <input type="text" id="code-input" maxlength="6" placeholder="123456" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-center tracking-widest text-xl text-white placeholder-slate-500">
            </div>
            <p id="code-error" class="text-red-400 text-sm hidden"></p>
            <button onclick="verifyCode()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition duration-200">Verify Email</button>
        </div>

        <!-- Step 3: Name -->
        <div id="step-name" class="space-y-5 hidden">
            <h2 class="text-3xl font-bold text-white">Email Verified!</h2>
            <p class="text-slate-400">Step 1: What is your name?</p>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Your Name</label>
                <input type="text" id="name-input" placeholder="John" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white placeholder-slate-500">
            </div>
            <button onclick="submitName()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition duration-200">Continue</button>
        </div>

        <!-- Step 4: Age Check -->
        <div id="step-age" class="space-y-5 hidden">
            <h2 class="text-3xl font-bold text-white">Step 2</h2>
            <p id="age-greeting" class="text-slate-400"></p>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">How old are you?</label>
                <input type="number" id="age-input" placeholder="18" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white placeholder-slate-500">
            </div>
            <p id="age-error" class="text-red-400 text-sm hidden"></p>
            <button onclick="submitAge()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition duration-200">Complete Registration</button>
        </div>

    </div>

    <script>
        // PASTE YOUR VERCEL PRODUCTION URL HERE (Do NOT include a trailing slash)
        const VERCEL_API_URL = "email-backend-r7qbz5l54-convex-llc.vercel.app";

        let userEmail = "";
        let userName = "";
        let expectedCode = "";

        function showStep(stepId) {
            ['step-email', 'step-verify', 'step-name', 'step-age'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(stepId).classList.remove('hidden');
        }

        async function sendVerificationCode() {
            userEmail = document.getElementById('email-input').value.trim();
            const errorEl = document.getElementById('email-error');
            const btn = document.getElementById('send-btn');

            if (!userEmail.includes('@')) {
                errorEl.innerText = "Please enter a valid email address.";
                errorEl.classList.remove('hidden');
                return;
            }

            errorEl.classList.add('hidden');
            btn.innerText = "Sending Email...";
            btn.disabled = true;

            try {
                const response = await fetch(`${VERCEL_API_URL}/api/send`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail })
                });

                const result = await response.json();

                if (result.success) {
                    expectedCode = result.code;
                    document.getElementById('sent-email-display').innerText = userEmail;
                    showStep('step-verify');
                } else {
                    errorEl.innerText = result.error || "Failed to send verification email.";
                    errorEl.classList.remove('hidden');
                }
            } catch (err) {
                errorEl.innerText = "Could not connect to Vercel API. Check your VERCEL_API_URL.";
                errorEl.classList.remove('hidden');
            } finally {
                btn.innerText = "Send Verification Code";
                btn.disabled = false;
            }
        }

        function verifyCode() {
            const enteredCode = document.getElementById('code-input').value.trim();
            const errorEl = document.getElementById('code-error');

            if (enteredCode === expectedCode) {
                showStep('step-name');
            } else {
                errorEl.innerText = "Incorrect verification code. Please try again.";
                errorEl.classList.remove('hidden');
            }
        }

        function submitName() {
            userName = document.getElementById('name-input').value.trim();
            if (!userName) return;

            document.getElementById('age-greeting').innerText = `OK, ${userName}, let's finish setting up.`;
            showStep('step-age');
        }

        function submitAge() {
            const age = parseInt(document.getElementById('age-input').value);
            const errorEl = document.getElementById('age-error');

            if (isNaN(age)) {
                errorEl.innerText = "Please enter a valid age.";
                errorEl.classList.remove('hidden');
                return;
            }

            if (age < 18) {
                errorEl.innerText = `Sorry ${userName}, you need to be at least 18 years old to register for this.`;
                errorEl.classList.remove('hidden');
            } else {
                // Success - Redirect to Google
                window.location.href = "https://www.google.com";
            }
        }
    </script>
</body>
</html>
