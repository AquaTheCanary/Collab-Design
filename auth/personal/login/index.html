<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Personal Login | Vectra</title>
  <link rel="stylesheet" href="/collab/static/css/style.css">
</head>
<body>
  <nav>
    <a href="/collab/home/" class="logo"><span class="logo-badge">📐</span> Vectra</a>
    <ul class="nav-links">
      <li><a href="/collab/home/">Home</a></li>
      <li><a href="/collab/auth/personal/register/">Sign Up</a></li>
    </ul>
  </nav>

  <main class="container">
    <div class="card">
      <h2>Personal Login</h2>
      <form action="/collab/dashboard/" method="GET" style="margin-top: 1.5rem;">
        <div class="form-group">
          <label>Personal Email</label>
          <input type="email" required placeholder="you@domain.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn" style="width: 100%;">Sign In</button>
      </form>
    </div>
  </main>
</body>
</html>
