<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
    <script>
        (function() {
            const repo = '/test.py';
            let path = window.location.pathname;

            // Strip repo prefix if present
            if (path.startsWith(repo)) {
                path = path.substring(repo.length);
            }

            // Split path into parts (e.g., "/home/" -> ["home"])
            const parts = path.split('/').filter(p => p.length > 0);

            // Infinite loop check: If the URL already ends with .html, stop routing
            if (parts.length > 0 && parts[parts.length - 1].endsWith('.html')) {
                document.addEventListener('DOMContentLoaded', function() {
                    document.getElementById('msg').innerHTML = 
                        '<h1 style="color: #f43f5e; font-size: 24px; margin-bottom: 8px;">404 - Page Not Found</h1>' +
                        '<p style="color: #94a3b8; font-size: 14px;">The page <code>' + window.location.pathname + '</code> could not be found.</p>';
                });
                return;
            }

            // Extract target folder name (default to "home" if visiting root)
            const folder = parts[0] || 'home';

            // Construct destination: /test.py/folder/folder.html
            const target = `${repo}/${folder}/${folder}.html`;

            // Instant redirect preserving query params and hashes
            window.location.replace(target + window.location.search + window.location.hash);
        })();
    </script>
</head>
<body style="background-color: #0f172a; color: #f8fafc; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center;">
    <div id="msg">
        <p>Loading...</p>
    </div>
</body>
</html>
