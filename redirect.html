<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loading...</title>
  <script>
    (function() {
      var path = window.location.pathname;
      if (path.endsWith('.html')) {
        var cleanPath = path.slice(0, -5); // Strips '.html'
        var targetUrl = cleanPath + window.location.search + window.location.hash;
        window.location.replace(targetUrl);
      }
    })();
  </script>
</head>
<body>
  <p>Loading...</p>
</body>
</html>
