<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Personal Account | Collab</title>
  <link rel="icon" type="image/png" href="../../../logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-black: #0a0a0c;
      --panel-bg: #141418;
      --border-color: #2a2a32;
      --brand-accent: #0f62fe;
      --text-gray: #a0a0ab;
      --text-light: #f4f4f8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-black); color: var(--text-light); min-height: 100vh; display: flex; flex-direction: column; }
    
    header { display: flex; align-items: center; justify-content: space-between; padding: 0.85rem 2rem; border-bottom: 1px solid var(--border-color); }
    .brand { display: flex; align-items: center; gap: 0.85rem; text-decoration: none; color: #fff; font-weight: 700; font-size: 1.15rem; }
    .brand img { height: 34px; width: auto; }
    
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .auth-card { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; width: 100%; max-width: 440px; padding: 2.5rem; }
    .auth-card h2 { font-size: 1.5rem; margin-bottom: 0.35rem; }
    
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--text-gray); margin-bottom: 0.4rem; }
    .form-group input { width: 100%; padding: 0.75rem; background: #0a0a0c; border: 1px solid var(--border-color); color: #fff; border-radius: 6px; }

    .btn { width: 100%; padding: 0.75rem; border-radius: 6px; font-weight: 600; cursor: pointer; border: none; background: var(--brand-accent); color: #fff; margin-top: 0.5rem; }
    .btn-secondary { background: transparent; border: 1px solid var(--border-color); color: #fff; }
    .step-box { display: none; }
    .step-box.active { display: block; }

    footer { border-top: 1px solid var(--border-color); padding: 2rem; text-align: center; color: var(--text-gray); font-size: 0.85rem; }
  </style>
</head>
<body>

  <header>
    <a href="../../../home/" class="brand">
      <img src="../../../logo.png" alt="Collab Design Logo">
      <span>Collab Design</span>
    </a>
  </header>

  <main>
    <div class="auth-card">
      <!-- Step 1: Personal Info -->
      <div id="step-1" class="step-box active">
        <h2>Create Personal Account</h2>
        <p style="color: var(--text-gray); font-size: 0.88rem; margin-bottom: 1.5rem;">Step 1 of 3: Profile Setup</p>

        <form onsubmit="handlePersonalStep1(event)">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="user-name" required placeholder="Alex Creator">
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="user-email" required placeholder="you@example.com">
          </div>
          <button type="submit" class="btn" id="sub-btn">Send Verification Code →</button>
        </form>
      </div>

      <!-- Step 2: OTP Verification -->
      <div id="step-2" class="step-box">
        <h2>Verify Your Email</h2>
        <p style="color: var(--text-gray); font-size: 0.88rem; margin-bottom: 1.5rem;">Step 2 of 3: Enter 6-digit code via SMTP</p>

        <div class="form-group">
          <label>Verification Code</label>
          <input type="text" id="otp-input" placeholder="123456" maxlength="6" style="text-align: center; font-size: 1.25rem; letter-spacing: 0.2em;">
        </div>
        <button type="button" class="btn" onclick="verifyPersonalOTP()">Verify Code →</button>
      </div>

      <!-- Step 3: Tier Selection -->
      <div id="step-3" class="step-box">
        <h2>Choose Creator Tier</h2>
        <p style="color: var(--text-gray); font-size: 0.88rem; margin-bottom: 1.5rem;">Step 3 of 3: Select Plan</p>

        <div style="display: flex; flex-direction: column; gap: 1rem;">
          <button class="btn" onclick="finalizePersonal('Personal Pro ($12/mo)')">Upgrade to Personal Pro ($12/mo)</button>
          <button class="btn btn-secondary" onclick="finalizePersonal('Free Tier')">Stick to Personal Free Tier</button>
        </div>
      </div>
    </div>
  </main>

  <footer>
    © Copyright (c) Collab Design 2026. A Convex Company. All rights reserved.
  </footer>

  <script>
    let pName = '', pEmail = '', generatedOTP = '';

    async function handlePersonalStep1(e) {
      e.preventDefault();
      pName = document.getElementById('user-name').value.trim();
      pEmail = document.getElementById('user-email').value.trim();
      
      generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();

      try {
        await fetch('/api/send-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: pEmail, code: generatedOTP })
        });
      } catch (err) {
        console.warn('Demo OTP code:', generatedOTP);
      }

      alert(`[Demo Mode] Verification code: ${generatedOTP}`);
      document.getElementById('step-1').classList.remove('active');
      document.getElementById('step-2').classList.add('active');
    }

    function verifyPersonalOTP() {
      const code = document.getElementById('otp-input').value.trim();
      if (code === generatedOTP) {
        document.getElementById('step-2').classList.remove('active');
        document.getElementById('step-3').classList.add('active');
      } else {
        alert('Incorrect verification code.');
      }
    }

    function finalizePersonal(plan) {
      const session = { isLoggedIn: true, name: pName, email: pEmail, type: 'personal', plan: plan };
      let db = JSON.parse(localStorage.getItem('collab_registered_users')) || [];
      db.push(session);
      localStorage.setItem('collab_registered_users', JSON.stringify(db));
      localStorage.setItem('collab_user_session', JSON.stringify(session));
      window.location.href = '../../../dashboard/';
    }
  </script>
</body>
</html>
