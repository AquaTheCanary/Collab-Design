<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Organisation | Collab</title>
  <link rel="icon" type="image/png" href="../../logo.png">
  <link rel="shortcut icon" type="image/png" href="../../logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../style.css">
</head>
<body>

  <header>
    <a href="../../home/" class="brand">
      <img src="../../logo.png" alt="Collab Design Logo">
      <span>Collab</span>
    </a>

    <div class="user-nav" id="nav-actions" data-depth="2"></div>
  </header>

  <main>
    <div class="card auth-card">
      <h2>Register Organisation</h2>
      <p style="color: var(--text-gray); font-size: 0.9rem; margin-top: 0.25rem;">Set up a new team account</p>

      <form id="org-reg-form">
        <div class="form-group">
          <label for="org-name">Organisation Name</label>
          <input type="text" id="org-name" required placeholder="Acme Inc.">
        </div>

        <div class="form-group">
          <label for="admin-email">Admin Email</label>
          <input type="email" id="admin-email" required placeholder="admin@company.com">
        </div>

        <div class="form-group">
          <label for="org-pass">Password</label>
          <input type="password" id="org-pass" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1.5rem;">Create Organisation</button>
      </form>
    </div>
  </main>

  <script src="../../auth.js"></script>
  <script>
    document.getElementById('org-reg-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('admin-email').value;
      handleLogin(email, 'organisation', '../../home/');
    });
  </script>
</body>
</html>
