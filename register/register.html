<!DOCTYPE html>
<html lang="en">
<head>
    <script>
    // Global Routing and API Configuration
    window.APP_CONFIG = {
        BASE: '/test.py',
        API_URL: 'https://testpy-emailbackend-aquathecanary-gamma.vercel.app/api/send'
    };

    // Helper function for clean page navigation from JS
    function goTo(page) {
        window.location.href = `${window.APP_CONFIG.BASE}/${page}/`;
    }
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- Header Navigation -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="/test.py/home.html" class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                <span class="w-3 h-3 bg-indigo-500 rounded-full inline-block"></span>
                Platform
            </a>
            <div class="flex items-center gap-4">
                <span class="text-slate-400 text-sm">Already have an account?</span>
                <a href="/test.py/login.html" class="text-slate-300 hover:text-white font-medium text-sm transition">Log In</a>
            </div>
        </div>
    </header>

    <!-- Main Wizard Card -->
    <main class="flex-1 flex items-center justify-center p-6">
        <div class="w-full max-w-md bg-slate-800 border border-slate-700/80 rounded-2xl p-8 shadow-2xl space-y-6">
            
            <!-- Step 1: Email Input -->
            <div id="step-email" class="space-y-4">
                <div class="text-center space-y-2">
                    <h1 class="text-2xl font-bold text-white tracking-tight">Create an account</h1>
                    <p class="text-slate-400 text-sm">Enter your email address to receive a verification passcode</p>
                </div>

                <form onsubmit="sendVerificationCode(event)" class="space-y-4">
                    <div>
                        <label for="reg-email" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Email address</label>
                        <input type="email" id="reg-email" required placeholder="you@example.com" 
                               class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition text-sm">
                    </div>

                    <button type="submit" id="send-code-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-4 rounded-xl transition shadow-lg shadow-indigo-600/25 text-sm flex items-center justify-center gap-2">
                        <span>Continue</span>
                    </button>
                </form>
            </div>

            <!-- Step 2: Code Verification -->
            <div id="step-code" class="space-y-4 hidden">
                <div class="text-center space-y-2">
                    <h1 class="text-2xl font-bold text-white tracking-tight">Enter Passcode</h1>
                    <p class="text-slate-400 text-sm">We sent a 6-digit passcode to <span id="display-sent-email" class="text-indigo-400 font-medium"></span></p>
                </div>

                <form onsubmit="verifyCode(event)" class="space-y-4">
                    <div>
                        <label for="passcode-input" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">6-Digit Code</label>
                        <input type="text" id="passcode-input" required maxlength="6" placeholder="123456" 
                               class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-center text-xl font-mono tracking-widest text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
                    </div>

                    <button type="submit" id="verify-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-4 rounded-xl transition shadow-lg shadow-indigo-600/25 text-sm">
                        Verify Passcode
                    </button>
                </form>
            </div>

            <!-- Step 3: Additional Info (Age) -->
            <div id="step-info" class="space-y-4 hidden">
                <div class="text-center space-y-2">
                    <h1 class="text-2xl font-bold text-white tracking-tight">Almost Done</h1>
                    <p class="text-slate-400 text-sm">Please tell us your age to complete registration</p>
                </div>

                <form onsubmit="finishRegistration(event)" class="space-y-4">
                    <div>
                        <label for="age-input" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Age</label>
                        <input type="number" id="age-input" required min="13" max="120" placeholder="18" 
                               class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition text-sm">
                    </div>

                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-4 rounded-xl transition shadow-lg shadow-indigo-600/25 text-sm">
                        Complete Account
                    </button>
                </form>
            </div>

            <p id="status-msg" class="text-xs text-center text-slate-400 hidden"></p>

        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 py-6 text-center text-slate-500 text-sm">
        &copy; Archie Sneddon. All rights reserved.
    </footer>

    <script>
        let generatedCode = null;
        let userEmail = '';

        async function sendVerificationCode(e) {
            e.preventDefault();
            userEmail = document.getElementById('reg-email').value;
            const btn = document.getElementById('send-code-btn');
            const status = document.getElementById('status-msg');

            // Generate 6-digit code
            generatedCode = Math.floor(100000 + Math.random() * 900000).toString();

            btn.disabled = true;
            btn.innerHTML = `<span class="inline-block animate-spin rounded-full h-4 w-4 border-2 border-white border-t-transparent"></span> Sending...`;

            try {
                const response = await fetch('https://testpy-emailbackend-aquathecanary-gamma.vercel.app/api/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail, code: generatedCode })
                });

                if (response.ok) {
                    document.getElementById('step-email').classList.add('hidden');
                    document.getElementById('step-code').classList.remove('hidden');
                    document.getElementById('display-sent-email').textContent = userEmail;
                    status.classList.add('hidden');
                } else {
                    throw new Error('API server returned error.');
                }
            } catch (err) {
                status.textContent = "Could not send verification code. Please check your email and try again.";
                status.className = "text-xs text-center text-rose-400 mt-2 block";
                btn.disabled = false;
                btn.textContent = "Continue";
            }
        }

        function verifyCode(e) {
            e.preventDefault();
            const entered = document.getElementById('passcode-input').value.trim();
            const status = document.getElementById('status-msg');

            if (entered === generatedCode) {
                document.getElementById('step-code').classList.add('hidden');
                document.getElementById('step-info').classList.remove('hidden');
                status.classList.add('hidden');
            } else {
                status.textContent = "Invalid code. Please double check your email.";
                status.className = "text-xs text-center text-rose-400 mt-2 block";
            }
        }

        function finishRegistration(e) {
            e.preventDefault();
            const age = document.getElementById('age-input').value;
            localStorage.setItem('userEmail', userEmail);
            localStorage.setItem('userAge', age);

            const status = document.getElementById('status-msg');
            status.textContent = "Account verified! Redirecting to dashboard...";
            status.className = "text-xs text-center text-emerald-400 mt-2 block";

            setTimeout(() => {
                window.location.href = "/test.py/dashboard.html";
            }, 1200);
        }
    </script>
</body>
</html>
