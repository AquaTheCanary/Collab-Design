<!DOCTYPE html>
<html lang="en">
<head>
    <script>
    // Global Routing and API Configuration
    window.APP_CONFIG = {
        BASE: '/test.py',
        API_URL: 'https://testpy-emailbackend-aquathecanary-gamma.vercel.app/api/send'
    };

    // Helper function for clean page navigation from JS
    function goTo(page) {
        window.location.href = `${window.APP_CONFIG.BASE}/${page}/`;
    }
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- Navigation Header -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="/test.py/home.html" class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                <span class="w-3 h-3 bg-indigo-500 rounded-full inline-block"></span>
                Platform
            </a>
            <div class="flex items-center gap-4">
                <span class="text-slate-400 text-sm">Don't have an account?</span>
                <a href="/test.py/register.html" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-4 py-2 rounded-xl text-sm transition shadow-lg shadow-indigo-600/20">Sign Up</a>
            </div>
        </div>
    </header>

    <!-- Main Card Container -->
    <main class="flex-1 flex items-center justify-center p-6">
        <div class="w-full max-w-md bg-slate-800 border border-slate-700/80 rounded-2xl p-8 shadow-2xl space-y-6">
            
            <div class="text-center space-y-2">
                <h1 class="text-2xl font-bold text-white tracking-tight">Welcome back</h1>
                <p class="text-slate-400 text-sm">Choose your preferred login method</p>
            </div>

            <!-- SSO Buttons -->
            <div class="space-y-3">
                <!-- Google SSO -->
                <button onclick="handleSSO('Google')" class="w-full flex items-center justify-center gap-3 bg-slate-700/60 hover:bg-slate-700 border border-slate-600/60 text-white font-medium py-3 px-4 rounded-xl transition text-sm">
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    Continue with Google
                </button>

                <!-- Apple SSO -->
                <button onclick="handleSSO('Apple')" class="w-full flex items-center justify-center gap-3 bg-slate-700/60 hover:bg-slate-700 border border-slate-600/60 text-white font-medium py-3 px-4 rounded-xl transition text-sm">
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 170 170">
                        <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.33.13-9.13-1.9-14.4-6.08-3.32-2.6-7.2-7.23-11.64-13.88-6.19-9.22-11.13-19.8-14.81-31.75-3.69-11.94-5.54-23.23-5.54-33.87 0-14.28 3.57-26.02 10.72-35.2 7.15-9.18 16.27-13.88 27.36-14.1 4.58 0 9.77 1.18 15.58 3.55 5.81 2.37 9.8 3.55 11.98 3.55 1.96 0 6.07-1.22 12.33-3.66 6.27-2.44 11.45-3.56 15.55-3.36 10.42.54 18.89 4.3 25.41 11.28-9.45 5.72-14.07 13.79-13.85 24.21.22 8.16 3.4 15.11 9.54 20.85 6.14 5.74 13.56 9.07 22.26 10-2.39 7.02-5.59 14.17-9.6 21.45zm-28.77-108.9c0 6.64-2.4 13.01-7.2 19.11-4.8 6.1-10.82 9.92-18.06 11.46-.33-1.09-.49-2.07-.49-2.94 0-6.74 2.5-13.25 7.51-19.53 5.01-6.28 11.12-10.15 18.33-11.61.11.87.16 1.7.16 2.51z"/>
                    </svg>
                    Continue with Apple
                </button>

                <!-- Microsoft SSO -->
                <button onclick="handleSSO('Microsoft')" class="w-full flex items-center justify-center gap-3 bg-slate-700/60 hover:bg-slate-700 border border-slate-600/60 text-white font-medium py-3 px-4 rounded-xl transition text-sm">
                    <svg class="w-5 h-5" viewBox="0 0 23 23">
                        <path fill="#f35325" d="M1 1h10v10H1z"/>
                        <path fill="#81bc06" d="M12 1h10v10H12z"/>
                        <path fill="#05a6f0" d="M1 12h10v10H1z"/>
                        <path fill="#ffba08" d="M12 12h10v10H12z"/>
                    </svg>
                    Continue with Microsoft
                </button>
            </div>

            <!-- Divider -->
            <div class="relative flex py-1 items-center">
                <div class="flex-grow border-t border-slate-700"></div>
                <span class="flex-shrink mx-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">or email</span>
                <div class="flex-grow border-t border-slate-700"></div>
            </div>

            <!-- Email Code Login Form -->
            <form id="login-form" onsubmit="handleEmailLogin(event)" class="space-y-4">
                <div>
                    <label for="login-email" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Email address</label>
                    <input type="email" id="login-email" required placeholder="you@example.com" 
                           class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition text-sm">
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-4 rounded-xl transition shadow-lg shadow-indigo-600/25 text-sm flex items-center justify-center gap-2">
                    <span>Send Verification Code</span>
                </button>
            </form>

            <p id="status-msg" class="text-xs text-center text-slate-400 hidden"></p>

        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 py-6 text-center text-slate-500 text-sm">
        &copy; Archie Sneddon. All rights reserved.
    </footer>

    <script>
        // Placeholder function for OAuth SSO redirects
        function handleSSO(provider) {
            const statusMsg = document.getElementById('status-msg');
            statusMsg.textContent = `Redirecting to ${provider} authentication...`;
            statusMsg.classList.remove('hidden', 'text-emerald-400', 'text-rose-400');
            statusMsg.classList.add('text-indigo-400');

            // In production, you will redirect to your OAuth provider URL here
            // e.g., window.location.href = `https://your-backend.vercel.app/api/auth/${provider.toLowerCase()}`;
        }

        // Email OTP code dispatcher (uses existing /api/send endpoint)
        async function handleEmailLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const submitBtn = document.getElementById('submit-btn');
            const statusMsg = document.getElementById('status-msg');

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span class="inline-block animate-spin rounded-full h-4 w-4 border-2 border-white border-t-transparent"></span> Sending...`;

            try {
                // Call your Vercel Node.js backend
                const response = await fetch('https://your-vercel-backend.vercel.app/api/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                if (response.ok) {
                    statusMsg.textContent = "Code sent! Check your inbox.";
                    statusMsg.className = "text-xs text-center text-emerald-400 mt-2";
                    // Save email and redirect to dashboard or verification screen
                    localStorage.setItem('userEmail', email);
                    setTimeout(() => {
                        window.location.href = "/test.py/dashboard.html";
                    }, 1500);
                } else {
                    throw new Error("Failed to send code.");
                }
            } catch (err) {
                statusMsg.textContent = "Could not send verification code. Try again.";
                statusMsg.className = "text-xs text-center text-rose-400 mt-2";
                submitBtn.disabled = false;
                submitBtn.textContent = "Send Verification Code";
            }
        }
    </script>
</body>
</html>
