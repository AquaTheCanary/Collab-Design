<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup Organisation | Collab</title>
  <script src="/assets/js/app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #000; --panel: #121212; --border: #262626; --brand: #0f62fe; --text-muted: #888; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg); color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
    
    nav { height: 68px; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 2rem; }
    .brand-container { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: #fff; font-weight: 800; font-size: 1.35rem; }

    .wizard-card { max-width: 500px; width: 100%; margin: 4rem auto; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 2.5rem; }
    .progress-bar { display: flex; gap: 0.5rem; margin-bottom: 2rem; }
    .step-pill { flex: 1; height: 4px; background: var(--border); border-radius: 2px; }
    .step-pill.active { background: var(--brand); }

    .step { display: none; }
    .step.active { display: block; }

    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--text-muted); }
    .form-group input, .form-group select { width: 100%; padding: 0.75rem 0.9rem; background: #000; border: 1px solid var(--border); border-radius: 6px; color: #fff; font-size: 0.95rem; }
    
    .btn-row { display: flex; gap: 0.75rem; margin-top: 1.5rem; }
    .btn { flex: 1; padding: 0.8rem; border-radius: 6px; font-weight: 700; cursor: pointer; border: none; text-align: center; }
    .btn-primary { background: #fff; color: #000; }
    .btn-secondary { background: #1a1a1a; color: #fff; border: 1px solid var(--border); }
  </style>
</head>
<body>
  <nav>
    <a href="#" id="homeBrand" class="brand-container">
      <svg width="32" height="32" viewBox="0 0 1000 1000" fill="none"><path d="M500 0C685 0 843 105 920 259C766 336 661 494 661 679C661 494 556 336 402 259C480 105 638 0 500 0Z" fill="#0f62fe"/><circle cx="500" cy="500" r="130" fill="#0f62fe"/></svg>
      <span>Collab Enterprise</span>
    </a>
  </nav>

  <div class="wizard-card">
    <div class="progress-bar">
      <div class="step-pill active" id="pill1"></div>
      <div class="step-pill" id="pill2"></div>
      <div class="step-pill" id="pill3"></div>
    </div>

    <!-- Step 1: Company Profile -->
    <div class="step active" id="step1">
      <h2 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 0.3rem;">Step 1: Organisation Profile</h2>
      <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem;">Establish your team's central workspace.</p>
      <div class="form-group">
        <label>Organisation Name</label>
        <input type="text" id="orgName" required placeholder="e.g. Acme Studio Inc.">
      </div>
      <div class="form-group">
        <label>Work Domain / URL Slug</label>
        <input type="text" id="orgSlug" required placeholder="acme-studio">
      </div>
      <button class="btn btn-primary" style="width: 100%;" onclick="nextStep(2)">Next: Team Seats →</button>
    </div>

    <!-- Step 2: Seats & Security -->
    <div class="step" id="step2">
      <h2 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 0.3rem;">Step 2: Team Capacity</h2>
      <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem;">Configure seat allocation and single sign-on.</p>
      <div class="form-group">
        <label>Expected Team Size</label>
        <select id="teamSize">
          <option value="5-10">5 - 10 Seats</option>
          <option value="10-50">10 - 50 Seats</option>
          <option value="50+">50+ Enterprise Seats</option>
        </select>
      </div>
      <div class="form-group">
        <label>Admin Handle</label>
        <input type="text" id="adminUser" required placeholder="e.g. admin_acme">
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="nextStep(1)">Back</button>
        <button class="btn btn-primary" onclick="nextStep(3)">Next: Review →</button>
      </div>
    </div>

    <!-- Step 3: Finalize Org Workspace -->
    <div class="step" id="step3">
      <h2 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 0.3rem;">Step 3: Deploy Workspace</h2>
      <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem;">Your enterprise team hub is ready for launch.</p>
      <div style="background: #080808; border: 1px solid var(--border); padding: 1rem; border-radius: 8px; font-size: 0.85rem; margin-bottom: 1.5rem;">
        <p style="margin-bottom: 0.4rem;">✓ Plan: <strong>Organisation Tier</strong></p>
        <p style="margin-bottom: 0.4rem;">✓ Destination: <strong>Team Dashboard</strong></p>
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="nextStep(2)">Back</button>
        <button class="btn btn-primary" onclick="finishOrgRegistration()">Deploy & Launch Dashboard</button>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('homeBrand').href = App.url('/home/index.html');

    function nextStep(stepNum) {
      document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.step-pill').forEach((p, idx) => {
        if (idx < stepNum) p.classList.add('active');
        else p.classList.remove('active');
      });
      document.getElementById(`step${stepNum}`).classList.add('active');
    }

    function finishOrgRegistration() {
      const adminUser = document.getElementById('adminUser').value.trim().toLowerCase() || 'org_admin';
      App.setSession(adminUser);

      // Redirects directly to Dashboard after organization creation
      window.location.href = App.url('/dashboard/index.html');
    }
  </script>
</body>
</html>
