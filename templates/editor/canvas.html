<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vectra | Vector Editor Workspace</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body style="overflow: hidden;">
  <div class="editor-toolbar">
    <a href="/" class="logo" style="margin-right: 1rem; font-size: 1.1rem;">📐 Vectra</a>
    <button class="tool-btn active" data-tool="select">👆 Select</button>
    <button class="tool-btn" data-tool="rect">🟦 Rectangle</button>
    <button class="tool-btn" data-tool="circle">⚪ Circle</button>
    <div style="margin-left: auto; display: flex; align-items: center; gap: 1rem;">
      <label style="font-size: 0.85rem; color: var(--text-muted);">Fill Color:</label>
      <input type="color" id="fillColor" value="#0d99ff" style="border: none; background: transparent; cursor: pointer; width: 30px; height: 30px;">
      <a href="/pricing" class="btn" style="padding: 0.3rem 0.8rem; font-size: 0.85rem;">Upgrade</a>
    </div>
  </div>

  <div class="editor-layout">
    <aside class="editor-sidebar">
      <h4 style="font-size: 0.85rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 1rem;">Layers</h4>
      <div id="layerCount" style="font-size: 0.9rem; color: var(--text-main);">0 Objects</div>
    </aside>

    <main class="canvas-container">
      <canvas id="designCanvas" width="900" height="600"></canvas>
    </main>
  </div>

  <script src="/static/js/editor.js"></script>
</body>
</html>
